{% extends 'base.html' %}

{% block title %} — Register{% endblock %}

{% block content %}

<section class="auth-panel parchment-panel">
  <h1 class="fs-3 mb-3"><i class="bi bi-person-plus"></i> Join the Guild as an adventurer</h1>

  <form action="{{ url_for('register') }}" method="post">

    <label for="txt_display_name" class="form-label">Adventurer name</label>
    <input type="text" class="form-control mb-3" name="txt_display_name" id="txt_display_name"
      placeholder="e.g. Roronoa Zoro" minlength="2" maxlength="25" required>

    <label for="txt_email" class="form-label">Email</label>
    <input type="email" class="form-control mb-3" name="txt_email" id="txt_email"
      placeholder="Insert your email address" required>

    <label for="txt_password" class="form-label">Password</label>
    <div class="input-group mb-3">
      <input type="password" class="form-control" name="txt_password" id="txt_password"
        placeholder="At least 8 characters" minlength="8" required>
      <button class="btn btn-outline-secondary toggle-password" type="button" data-target="txt_password"
        aria-label="Show or hide password"><i class="bi bi-eye"></i></button>
    </div>

    <label for="txt_confirm_password" class="form-label">Confirm password</label>
    <div class="input-group mb-1">
      <input type="password" class="form-control" name="txt_confirm_password" id="txt_confirm_password"
        placeholder="Repeat your password" minlength="8" required>
      <button class="btn btn-outline-secondary toggle-password" type="button" data-target="txt_confirm_password"
        aria-label="Show or hide password"><i class="bi bi-eye"></i></button>
    </div>
    <p class="mb-3"><small id="password-match" class="text-muted-ink"></small></p>

    <button type="submit" class="btn btn-gold w-100">Register</button>
  </form>

  <hr>
  <p class="mb-0">Already one of us? <a href="{{ url_for('login') }}">Login</a></p>
</section>

{% endblock %}
