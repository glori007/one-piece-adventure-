{% extends 'base.html' %}

{% block title %} — New Quest{% endblock %}

{% block content %}

<section class="form-panel parchment-panel">
  <h1 class="fs-3 mb-3"><i class="bi bi-plus-circle"></i> Create a new quest</h1>
  <p>Once created, a quest cannot be modified — check everything twice, like a good navigator.</p>

  <form action="{{ url_for('create_quest') }}" method="post" enctype="multipart/form-data">

    <label for="txt_title" class="form-label">Quest title</label>
    <input type="text" class="form-control mb-3" name="txt_title" id="txt_title" placeholder="e.g. Onigashima Raid"
      maxlength="80" required>

    <div class="row g-3">
      <div class="col-4">
        <label for="txt_duration" class="form-label">Duration (minutes)</label>
        <input type="number" class="form-control mb-3" name="txt_duration" id="txt_duration" min="1" max="1440"
          placeholder="e.g. 90" required>
      </div>
      <div class="col-4">
        <label for="type" class="form-label">Quest type</label>
        <select class="form-select mb-3" name="type" id="type" required>
          {% for qtype in QUEST_TYPES %}
          <option value="{{ qtype }}">{{ qtype }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-4">
        <label for="difficulty" class="form-label">Difficulty</label>
        <select class="form-select mb-3" name="difficulty" id="difficulty" required>
          {% for level in DIFFICULTIES %}
          <option value="{{ level }}">{{ level }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <label for="txt_description" class="form-label">Short description</label>
    <textarea class="form-control" name="txt_description" id="txt_description" rows="4"
      maxlength="{{ MAX_DESCRIPTION_CHARS }}" placeholder="What awaits the party on this adventure?"
      required></textarea>
    <p class="mb-3">
      <small id="desc-counter" class="text-muted-ink" data-max="{{ MAX_DESCRIPTION_CHARS }}">
        0 / {{ MAX_DESCRIPTION_CHARS }} characters
      </small>
    </p>

    <label for="quest_img" class="form-label">Promotional image</label>
    <input type="file" class="form-control mb-3" name="quest_img" id="quest_img"
      accept=".jpg, .jpeg, .png, .webp, .avif" required>

    <button type="submit" class="btn btn-gold w-100"><i class="bi bi-plus-circle"></i> Create quest</button>
  </form>
</section>

{% endblock %}
